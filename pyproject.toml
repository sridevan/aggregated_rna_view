[project]
name = "rna-explorer"
version = "0.1.0"
description = "Rfam consensus residue mapping and aggregation pipeline for experimentally determined RNA structures"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "jsonschema>=4"]

[project.optional-dependencies]
test = ["pytest>=7"]
sasa = ["freesasa>=2.2", "gemmi>=0.6", "numpy>=1.24"]
clustering = ["numpy>=1.24", "scipy>=1.10"]   # TPPL seriation (vendored ordering_similarity.py needs scipy linkage)

[tool.pytest.ini_options]
testpaths = ["tests"]
